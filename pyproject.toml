[project]
name = "rag-world"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kushal Kumar", email = "kjay45371@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=0.5",
    "datasets>=3.1",
    "docx2txt>=0.8",
    "easyocr>=1.7.2",
    "fastapi>=0.115",
    "gitpython>=3.1",
    "httpx>=0.27",
    "langchain>=1.2.4",
    "langchain-chroma>=0.2",
    "langchain-community>=0.4",
    "langchain-core>=0.4",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.3",
    "langchain-postgres>=0.0.12",
    "langgraph>=1.0.0",
    "langsmith>=0.1.140",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.1",
    "pypdfium2>=5.13.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "ragas>=0.2.10",
    "rank-bm25>=0.2.2",
    "streamlit>=1.40",
    "tenacity>=9.0",
    "tiktoken>=0.8",
    "unstructured>=0.16",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
rag-world = "rag_world:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
